<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tileGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tileGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="tileGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="tileGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- 4 Grid Tiles representing Sanitaryware & Tile ERP -->
  <rect x="12" y="12" width="18" height="18" rx="4" fill="url(#tileGrad1)"/>
  <rect x="34" y="12" width="18" height="18" rx="4" fill="url(#tileGrad2)"/>
  <rect x="12" y="34" width="18" height="18" rx="4" fill="url(#tileGrad3)"/>
  <rect x="34" y="34" width="18" height="18" rx="4" fill="url(#tileGrad4)"/>

  <!-- Glossy Reflection Highlight -->
  <path d="M 12 12 L 30 12 L 12 30 Z" fill="#ffffff" fill-opacity="0.2"/>
  <path d="M 34 12 L 52 12 L 34 30 Z" fill="#ffffff" fill-opacity="0.2"/>
</svg>
